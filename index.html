<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Légendes du FC Barcelone</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ========== EN-TÊTE ========== -->
<header class="site-header">
    <div class="header-inner">
        <img src="img/Barcelone-logo.png" alt="Logo FC Barcelone" class="header-logo-img" />
        <h1>Les Légendes du Barça</h1>
        <p class="header-subtitle">FC Barcelona — Els grans de sempre</p>
    </div>
</header>

<!-- ========== NAVIGATION ========== -->
<nav class="site-nav" aria-label="Navigation principale">
    <div class="nav-inner">
        <a href="#liste" class="nav-link">🏅 Légendes</a>
        <a href="#form-add" class="nav-link">➕ Ajouter</a>
    </div>
</nav>

<!-- ========== CONTENU PRINCIPAL ========== -->
<main id="contenu" class="site-main">

    <!-- Barre d'outils : recherche + tris + filtre -->
    <section class="toolbar" aria-label="Filtres et tri">
        <input
                type="search"
                id="search"
                placeholder="🔍 Rechercher une légende..."
                aria-label="Rechercher une légende"
                autocomplete="off"
        />

        <select id="filter-poste" aria-label="Filtrer par poste">
            <option value="">Tous les postes</option>
            <option value="Gardien">Gardien</option>
            <option value="Défenseur">Défenseur</option>
            <option value="Milieu">Milieu</option>
            <option value="Attaquant">Attaquant</option>
        </select>

        <button id="btn-sort-rating" class="btn btn-primary" aria-label="Trier par note">
            Trier par note ↓
        </button>

        <button id="btn-sort-titres" class="btn btn-secondary" aria-label="Trier par titres">
            Trier par titres ↓
        </button>
    </section>

    <!-- Compteur de résultats -->
    <p id="resultat-count" class="result-count" aria-live="polite"></p>

    <!-- ===== LISTE DES LÉGENDES ===== -->
    <section id="liste" aria-label="Liste des légendes">
        <ul id="list" aria-label="Cartes des légendes"></ul>
    </section>

    <!-- ===== FORMULAIRE D'AJOUT ===== -->
    <section class="form-section" aria-labelledby="form-title">
        <h2 id="form-title" class="form-heading">➕ Ajouter une légende</h2>

        <form id="form-add" novalidate>

            <div class="form-group">
                <label for="input-name">Nom du joueur *</label>
                <input
                        type="text"
                        id="input-name"
                        name="name"
                        placeholder="ex. Johan Cruyff"
                        required
                        minlength="2"
                        maxlength="60"
                />
                <span class="form-error" id="error-name" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="input-poste">Poste *</label>
                <select id="input-poste" name="poste" required>
                    <option value="">— Choisir un poste —</option>
                    <option value="Gardien">Gardien</option>
                    <option value="Défenseur">Défenseur</option>
                    <option value="Milieu">Milieu</option>
                    <option value="Attaquant">Attaquant</option>
                </select>
                <span class="form-error" id="error-poste" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="input-annees">Années au Barça *</label>
                <input
                        type="text"
                        id="input-annees"
                        name="annees"
                        placeholder="ex. 1973–1978"
                        required
                />
                <span class="form-error" id="error-annees" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="input-titres">Nombre de titres *</label>
                <input
                        type="number"
                        id="input-titres"
                        name="titres"
                        placeholder="ex. 14"
                        min="0"
                        max="99"
                        required
                />
                <span class="form-error" id="error-titres" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="input-rating">Note (1–10) *</label>
                <input
                        type="number"
                        id="input-rating"
                        name="rating"
                        placeholder="ex. 9.5"
                        min="1"
                        max="10"
                        step="0.1"
                        required
                />
                <span class="form-error" id="error-rating" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="input-nationalite">Nationalité</label>
                <input
                        type="text"
                        id="input-nationalite"
                        name="nationalite"
                        placeholder="ex. Argentin"
                />
            </div>

            <div class="form-group">
                <label for="input-image">URL de l'image</label>
                <input
                        type="url"
                        id="input-image"
                        name="image"
                        placeholder="https://exemple.com/photo.jpg"
                />
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Ajouter la légende</button>
                <button type="reset" class="btn btn-ghost">Réinitialiser</button>
            </div>

        </form>
    </section>

</main>

<!-- ========== PIED DE PAGE ========== -->
<footer class="site-footer">
    <p>Légendes du FC Barcelone · Més que un club · By Loïc Mouttet</p>
</footer>

<!-- Modal de détail -->
<div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-name" hidden>
    <div class="modal-box">
        <button class="modal-close" id="modal-close" aria-label="Fermer">✕</button>
        <img id="modal-img" src="" alt="" class="modal-img" />
        <div class="modal-content">
            <p id="modal-poste" class="modal-poste"></p>
            <h2 id="modal-name"></h2>
            <p id="modal-annees" class="modal-annees"></p>
            <div class="modal-stats">
                <div class="stat-box"><span id="modal-titres"></span><small>Titres</small></div>
                <div class="stat-box"><span id="modal-rating"></span><small>Note</small></div>
                <div class="stat-box"><span id="modal-nat"></span><small>Nationalité</small></div>
            </div>
            <p id="modal-desc" class="modal-desc"></p>
            <button id="modal-btn-edit" class="btn btn-primary btn-modal-edit">✏️ Modifier</button>
        </div>
    </div>
</div>

<!-- Modal de modification -->
<div id="edit-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="edit-title" hidden>
    <div class="modal-box">
        <button class="modal-close" id="edit-close" aria-label="Fermer">✕</button>
        <div class="modal-content">
            <h2 id="edit-title" class="form-heading">✏️ Modifier la légende</h2>
            <form id="form-edit" novalidate>
                <input type="hidden" id="edit-id" />

                <div class="form-group">
                    <label for="edit-name">Nom du joueur *</label>
                    <input type="text" id="edit-name" required minlength="2" maxlength="60" />
                    <span class="form-error" id="error-edit-name" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="edit-poste">Poste *</label>
                    <select id="edit-poste" required>
                        <option value="">— Choisir un poste —</option>
                        <option value="Gardien">Gardien</option>
                        <option value="Défenseur">Défenseur</option>
                        <option value="Milieu">Milieu</option>
                        <option value="Attaquant">Attaquant</option>
                    </select>
                    <span class="form-error" id="error-edit-poste" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="edit-annees">Années au Barça *</label>
                    <input type="text" id="edit-annees" required />
                    <span class="form-error" id="error-edit-annees" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="edit-titres">Nombre de titres *</label>
                    <input type="number" id="edit-titres" min="0" max="99" required />
                    <span class="form-error" id="error-edit-titres" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="edit-rating">Note (1–10) *</label>
                    <input type="number" id="edit-rating" min="1" max="10" step="0.1" required />
                    <span class="form-error" id="error-edit-rating" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="edit-nationalite">Nationalité</label>
                    <input type="text" id="edit-nationalite" />
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                    <button type="button" id="edit-cancel" class="btn btn-ghost">Annuler</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
